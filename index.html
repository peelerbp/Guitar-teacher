<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Guitar Practice Coach</title><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#101319"><style>
*{box-sizing:border-box}body{margin:0;background:#101319;color:#f7f7f7;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{max-width:760px;margin:auto;padding:18px 14px 40px}.tabs,.row{display:flex;gap:8px}.tabs button,.row>*{flex:1}button,select{border:0;border-radius:11px;padding:12px;background:#29303a;color:white;font-weight:750}.on,.primary{background:#ffb000;color:#111}.card{background:#191e26;border:1px solid #2d3440;border-radius:17px;padding:16px;margin:11px 0}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.big{text-align:center;font-size:56px;font-weight:900}.muted{color:#9da6b4}.hidden{display:none}.fwrap{overflow:auto}.fret{display:grid;grid-template-columns:38px repeat(13,44px);min-width:610px;margin-top:12px}.cell{height:38px;border-right:1px solid #59616d;border-bottom:1px solid #39404a;display:flex;align-items:center;justify-content:center;font-size:12px}.dot{width:28px;height:28px;border-radius:50%;background:#3b4552;display:flex;align-items:center;justify-content:center;font-weight:800}.root{background:#ffb000;color:#111}.diagram{white-space:pre;font-family:monospace;text-align:center;background:#0e1217;padding:12px;border-radius:12px}.wide{width:100%}.danger{background:#8b2d35}input{width:100%;accent-color:#ffb000}</style></head><body><main>
<h1>🎸 Guitar Practice Coach</h1><div class="muted">Chord changes, scales, fretboard & metronome</div>
<div class="tabs"><button id="tc" class="on" onclick="tab('c')">CHORD PRACTICE</button><button id="ts" onclick="tab('s')">SCALE PRACTICE</button></div>
<div id="cp"><div class="card"><b>Choose chords</b><div id="chords" class="grid" style="margin-top:10px"></div></div><div class="card"><b>Tempo: <span id="bpm">80</span> BPM</b><input id="r1" type="range" min="40" max="200" value="80" oninput="tempo(this.value)"></div><div class="card"><b>Beats per chord</b><div class="row"><button onclick="beatSet(-1)">−</button><button id="beats">4</button><button onclick="beatSet(1)">+</button></div></div><div class="card"><div id="cur" class="big">Ready</div><div style="text-align:center">Next: <b id="next">—</b></div><div id="diag" class="diagram"></div></div><div class="row"><button class="primary" onclick="startChord()">START</button><button class="danger" onclick="stop()">STOP</button></div></div>
<div id="sp" class="hidden"><div class="card"><b>Choose scale</b><div class="row" style="margin-top:10px"><select id="key" onchange="draw()"></select><select id="scale" onchange="draw()"><option value="maj">Major</option><option value="min">Natural Minor</option><option value="majp">Major Pentatonic</option><option value="minp" selected>Minor Pentatonic</option><option value="blues">Blues</option><option value="dor">Dorian</option><option value="mix">Mixolydian</option></select></div></div><div class="card"><b>Tempo: <span id="bpm2">80</span> BPM</b><input id="r2" type="range" min="40" max="200" value="80" oninput="tempo(this.value)"></div><div class="card"><b id="stitle"></b><div id="snotes" class="muted"></div><div class="fwrap"><div id="fret" class="fret"></div></div></div><div class="row"><button class="primary" onclick="startMetro()">START METRONOME</button><button class="danger" onclick="stop()">STOP</button></div></div>
<script>
const $=x=>document.getElementById(x),CD={"C":"x32010","G":"320003","D":"xx0232","A":"x02220","E":"022100","Am":"x02210","Em":"022000","Dm":"xx0231","F":"133211","Bm":"x24432","C7":"x32310","D7":"xx0212","E7":"020100","A7":"x02020","G7":"320001","Dsus4":"xx0233","Asus4":"x02230"};let sel=["G","C","D","Em"],bpm=80,beats=4,i=0,b=0,t=null,ac=null;
Object.keys(CD).forEach(c=>{let x=document.createElement("button");x.textContent=c;x.dataset.c=c;x.onclick=()=>{if(sel.includes(c)){if(sel.length>2)sel=sel.filter(v=>v!=c)}else if(sel.length<6)sel.push(c);render()};$("chords").appendChild(x)});
function render(){document.querySelectorAll("#chords button").forEach(x=>x.classList.toggle("on",sel.includes(x.dataset.c)))}function tempo(v){bpm=+v;$("bpm").textContent=bpm;$("bpm2").textContent=bpm;$("r1").value=bpm;$("r2").value=bpm}function beatSet(d){beats=Math.max(1,Math.min(16,beats+d));$("beats").textContent=beats}
function click(a){ac=ac||new AudioContext();let o=ac.createOscillator(),g=ac.createGain();o.frequency.value=a?1100:760;g.gain.setValueAtTime(.12,ac.currentTime);g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+.05);o.connect(g).connect(ac.destination);o.start();o.stop(ac.currentTime+.06)}
function shape(s){return "e  "+s[5]+"\nB  "+s[4]+"\nG  "+s[3]+"\nD  "+s[2]+"\nA  "+s[1]+"\nE  "+s[0]}function show(){let c=sel[i];$("cur").textContent=c;$("next").textContent=sel[(i+1)%sel.length];$("diag").textContent=shape(CD[c])}
function stop(){if(t)clearInterval(t);t=null}function startChord(){stop();i=0;b=0;show();let f=()=>{b++;if(b>beats){b=1;i=(i+1)%sel.length;show()}click(b==1)};f();t=setInterval(f,60000/bpm)}function startMetro(){stop();let n=0;click(1);t=setInterval(()=>{n++;click(n%4==0)},60000/bpm)}
function tab(x){$("cp").classList.toggle("hidden",x!="c");$("sp").classList.toggle("hidden",x!="s");$("tc").classList.toggle("on",x=="c");$("ts").classList.toggle("on",x=="s");stop()}
const N=["C","C#","D","D#","E","F","F#","G","G#","A","A#","B"],O=[4,11,7,2,9,4],I={maj:[0,2,4,5,7,9,11],min:[0,2,3,5,7,8,10],majp:[0,2,4,7,9],minp:[0,3,5,7,10],blues:[0,3,5,6,7,10],dor:[0,2,3,5,7,9,10],mix:[0,2,4,5,7,9,10]};N.forEach(n=>{let o=document.createElement("option");o.textContent=o.value=n;$("key").appendChild(o)});$("key").value="A";
function draw(){let ri=N.indexOf($("key").value),a=I[$("scale").value].map(x=>(ri+x)%12),f=$("fret");f.innerHTML="";let z=document.createElement("div");z.className="cell";f.appendChild(z);for(let q=0;q<=12;q++){z=document.createElement("div");z.className="cell";z.textContent=q;f.appendChild(z)};["e","B","G","D","A","E"].forEach((sn,s)=>{z=document.createElement("div");z.className="cell";z.textContent=sn;f.appendChild(z);for(let q=0;q<=12;q++){let p=(O[s]+q)%12,c=document.createElement("div");c.className="cell";if(a.includes(p)){let d=document.createElement("span");d.className="dot"+(p==ri?" root":"");d.textContent=N[p];c.appendChild(d)}f.appendChild(c)}});$("stitle").textContent=$("key").value+" "+$("scale").options[$("scale").selectedIndex].text;$("snotes").textContent="Notes: "+a.map(x=>N[x]).join(" • ")}
render();show();draw();if("serviceWorker"in navigator)addEventListener("load",()=>navigator.serviceWorker.register("./sw.js"));
</script></main></body></html>
